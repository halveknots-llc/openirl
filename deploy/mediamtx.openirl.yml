# OpenIRL feature areas MediaMTX template.
# This is intentionally conservative: it enables common IRL ingest protocols,
# local API/metrics, and named paths that OBS can consume from the local host.
# Media listeners bind to loopback by default. Exposing them to a LAN/VPN
# requires an explicit private-network boundary and authenticated ingress.

logLevel: info
api: true
apiAddress: 127.0.0.1:9997
metrics: true
metricsAddress: 127.0.0.1:9998

rtmp: true
rtmpAddress: 127.0.0.1:1935

srt: true
srtAddress: 127.0.0.1:9000

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []
webrtcAllowOrigins: ["http://127.0.0.1:7707", "http://localhost:7707", "http://127.0.0.1:8889", "http://localhost:8889"]

# Explicitly disable upstream defaults (reviewed against MediaMTX v1.21.2).
hls: false
rtsp: false
moq: false
pprof: false
playback: false

paths:
  openirl-main:
    source: publisher
  moblin-main:
    source: publisher
  irlpro-main:
    source: publisher
  belabox-main:
    source: publisher
  backup-main:
    source: publisher
