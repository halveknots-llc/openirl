# Minimal MediaMTX config for OpenIRL relay process supervision.
# Media listeners stay on loopback by default. Change each media address only
# with an explicit private-network/VPN boundary and an authenticated ingest
# policy in front of the listener.
api: yes
apiAddress: 127.0.0.1:9997
metrics: yes
metricsAddress: 127.0.0.1:9998
rtmp: yes
rtmpAddress: 127.0.0.1:1935
srt: yes
srtAddress: 127.0.0.1:9000
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcLocalTCPAddress: ""
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [127.0.0.1]
webrtcICEServers2: []
webrtcAllowOrigins: ["http://127.0.0.1:7707", "http://localhost:7707", "http://127.0.0.1:8889", "http://localhost:8889"]
# Explicitly disable upstream defaults (reviewed against MediaMTX v1.21.2).
hls: no
rtsp: no
moq: no
pprof: no
playback: no
paths:
  all:
    source: publisher
